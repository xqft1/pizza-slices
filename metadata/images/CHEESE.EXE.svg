<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1280"
     height="1280"
     viewBox="0 0 1280 1280">

  <image
    href="{{IMAGE}}"
    x="0"
    y="0"
    width="1280"
    height="1280"
  />

  <text
    x="835"
    y="210"
    text-anchor="middle"
    font-family="monospace"
    font-size="100"
    font-weight="bold"
    fill="#f8fafb">#{{TOKEN}}</text>

     <text
    x="40"
    y="75"
    font-family="'Courier New', Courier, monospace"
    font-size="34"
    font-weight="bold"
    fill="#39FF14"
    xml:space="preserve">

    <tspan x="40" dy="10">PIZZA SLICES</tspan>

</text>

<text
    x="40"
    y="75"
    font-family="'Courier New', Courier, monospace"
    font-size="19"
    font-weight="bold"
    fill="#ffffff"
    xml:space="preserve">

    <tspan x="40" dy="48">Upgrade your slice -> satopizza.xyz</tspan>

</text>

<text
    x="70"
    y="75"
    font-family="'Courier New', Courier, monospace"
    font-size="25"
    font-weight="bold"
    fill="#39FF14"
    xml:space="preserve">

    <tspan x="40" dy="87">C:/LEVEL: {{SLICE}}</tspan>

</text>

<text
    x="70"
    y="75"
    font-family="'Courier New', Courier, monospace"
    font-size="25"
    font-weight="bold"
    fill="#39FF14"
    xml:space="preserve">

    <tspan x="40" dy="127">C:/CRUST: {{CRUST}}</tspan>

</text>

</svg>
